apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitored-service
  namespace: nimip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitored-service
  template:
    metadata:
      labels:
        app: monitored-service
    spec:
      containers:
        - name: monitored-service
          image: nimip-monitored-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - containerPort: 5002
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitored-service
  namespace: nimip
spec:
  selector:
    app: monitored-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
